# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Auto Crawler

on:
  workflow_dispatch:

  schedule:
    - cron: '0 0,3,6,9,12,15 * * *'

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 120
    strategy:
      matrix:
        python-version: [3.12]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Chrome
      id: chrome
      uses: browser-actions/setup-chrome@v1
      with:
        chrome-version: stable
        install-chromedriver: true

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if (Test-Path "requirements.txt") { pip install -r .\requirements.txt }

    - name: Test parser and data safety
      run: python -m unittest test_data_safety test_danawa_parser

    - name: Run Crawler
      run: |
        python danawa_crawler.py
      env:
        CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        CHROMEDRIVER_PATH: ${{ steps.chrome.outputs.chromedriver-path }}
        PYTHONUNBUFFERED: '1'
    - name: Upload failure diagnostics
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: crawler-diagnostics
        path: diagnostics/
        if-no-files-found: ignore
    - name: Commits
      run: |
        git config --local user.email "sty1393@gmail.com"
        git config --local user.name "Auto_Crawler_Bot"
        git add -- crawl_data/*.csv
        git diff --cached --quiet
        if ($LASTEXITCODE -eq 0) { exit 0 }
        if ($LASTEXITCODE -ne 1) { throw "git diff failed" }
        $stamp = [TimeZoneInfo]::ConvertTimeBySystemTimeZoneId([DateTime]::UtcNow, 'Korea Standard Time').ToString('yyyy-MM-dd HH:mm:ss')
        git commit -m "Bot - Auto Crawl | $stamp"
    - name: Push
      uses: ad-m/github-push-action@master
      with:
        branch: 'master'
        github_token: ${{ secrets.MY_GITHUB_TOKEN }}
        
